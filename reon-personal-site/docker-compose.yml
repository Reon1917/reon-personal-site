services:
  app:
    build: .
    image: lin-portfolio-app
    container_name: lin-portfolio-app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    container_name: lin-portfolio-proxy
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
